# fly.toml app configuration file generated for quiz-battle-rippling-sky-7959 on 2026-05-04T14:53:25-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quiz-battle-rippling-sky-7959'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[deploy]
  # "immediate" kills the old machine before starting the new one,
  # preventing two machines from running simultaneously.
  # Critical for in-memory Socket.io state — two machines = split brain.
  strategy = "immediate"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
